<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #45a049;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .home {
            display: none;
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h3 id="title"></h3>
    <input type="password" id="password" placeholder="أدخل كلمة السر">
    <button onclick="submitPassword()">✔ صح</button>
    <div class="error" id="error"></div>
</div>

<div class="home" id="homePage">
    <h2>🏠 Home</h2>
    <p>هذه صفحة فارغة</p>
</div>

<script>
    const storedPassword = localStorage.getItem("myPassword");

    const title = document.getElementById("title");
    const error = document.getElementById("error");

    if (storedPassword === null) {
        title.textContent = "أنشئ كلمة سر جديدة";
    } else {
        title.textContent = "أدخل كلمة السر";
    }

    function submitPassword() {
        const inputPassword = document.getElementById("password").value;

        if (storedPassword === null) {
            if (inputPassword.length < 4) {
                error.textContent = "كلمة السر قصيرة جدًا";
                return;
            }
            localStorage.setItem("myPassword", inputPassword);
            goHome();
        } else {
            if (inputPassword === storedPassword) {
                goHome();
            } else {
                error.textContent = "كلمة السر غير صحيحة";
            }
        }
    }

    function goHome() {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("homePage").style.display = "block";
    }
</script>

</body>
</html>
